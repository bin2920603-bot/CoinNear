name: upbit-alert

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

concurrency:
  group: upbit-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          pip install -q -r requirements.txt

      - name: Run loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_UPBIT: ${{ secrets.CHAT_UPBIT }}
        run: |
          START=$SECONDS
          while [ $((SECONDS - START)) -lt 20000 ]; do
            python upbit.py || echo "실행 실패"
            sleep 240
          done
