name: near-alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: near-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          pip install -q -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_EMA7: "-5337641717"
          CHAT_EMA10: "-5490784309"
          CHAT_EMA20: "-5323050605"
          CHAT_EMA50: "-5368303077"
          CHAT_EMA120: "-5558984787"
          CHAT_EMA200: "-5491460050"
          CHAT_VWAP100: "-5568269082"
          CHAT_GC: "-5499612307"
          CHAT_DC: "-5325965861"
          CHAT_BULL: "-5494593596"
          CHAT_BEAR: "-5426808665"
        run: python main.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
