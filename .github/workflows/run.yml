name: near-alert

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: near-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          pip install -q -r requirements.txt

      - name: Run loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_EMA7: "6667903479"
        run: |
          START=$SECONDS
          while [ $((SECONDS - START)) -lt 20000 ]; do
            timeout 900 python main.py || echo "실행 실패 또는 시간초과"
            sleep 240
          done
