name: near-alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: near-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          pip install -q -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore upbit state
        uses: actions/cache/restore@v4
        with:
          path: upbit_state.json
          key: upbit-state-${{ github.run_id }}
          restore-keys: upbit-state-

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_EMA7: "6667903479"
        run: python main.py

      - name: Run upbit
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_UPBIT: ${{ secrets.CHAT_UPBIT }}
        run: python upbit.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Save upbit state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: upbit_state.json
          key: upbit-state-${{ github.run_id }}
